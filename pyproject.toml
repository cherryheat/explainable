[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cherryheat-explainable"
version = "0.1.0"
description = "把每个结论还原到支撑它的具体样本，标出仅靠少量样本支撑的结论"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cherryheat" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cherryheat.github.io"
Repository = "https://github.com/cherryheat/explainable"
Issues = "https://github.com/cherryheat/explainable/issues"

[project.scripts]
explainable = "explainable:main"

[tool.setuptools]
py-modules = ["explainable"]
